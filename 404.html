<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <script type="text/javascript">
      // Redirige vers index.html pour laisser React Router gérer la route
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var redirectTo = '/portfolio/index.html?redirect=' + encodeURIComponent(pathname + search + hash);
      window.location.replace(redirectTo);
    </script>
  </head>
  <body>
  </body>
</html>
